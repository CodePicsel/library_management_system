spring.application.name=lmsBackend

# If Railway provides JDBC_DATABASE_URL, use it. Otherwise, use your local Lms_db.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/Lms_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:Harshal@2003}

# Essential for hosting
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.level.org.springframework.security=DEBUG